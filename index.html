<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#091426"><title>MOONLIGHT TRAINER | 完全固定鍵盤</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;color:#f3f7ff;background:#091426}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{background:linear-gradient(150deg,#172b4d,#091426 65%)}button,select{font:inherit}.app{height:100dvh;display:flex;flex-direction:column;gap:6px;padding:calc(5px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(5px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}.title{font-size:clamp(16px,2.7vw,23px);font-weight:800;white-space:nowrap}.subtitle{font-size:10px;color:#a9c9f4}.status{font-size:12px;color:#f9d485;font-weight:800}.settings{display:flex;gap:7px;align-items:center;flex:none}.settings label{font-size:11px;color:#c1d3ed;display:flex;align-items:center;gap:6px}select{background:#263b5d;border:1px solid #54749f;color:white;border-radius:8px;padding:4px 8px;height:34px;font-size:13px}.guide{border:1px solid #405d86;background:#101e36;border-radius:12px;padding:7px 10px;flex:1;min-height:0;display:flex;flex-direction:column;gap:4px;overflow:hidden}.current{display:flex;align-items:center;justify-content:space-between;flex:none}.next{font-size:clamp(15px,3vw,22px);font-weight:800}.finger{color:#f4d28d;font-size:12px}.progress{background:#2c415c;border-radius:10px;height:5px;overflow:hidden;flex:none}.fill{background:#ffc96d;height:100%;width:0%;transition:width .15s}.roll{flex:1;min-height:20px;display:flex;gap:5px;align-items:stretch;overflow:hidden}.note{display:flex;align-items:flex-end;justify-content:center;padding:0 3px 7px;background:linear-gradient(#568fdb,#2a5caa);border-radius:7px;color:white;font-size:clamp(10px,1.6vw,15px);font-weight:bold;flex:1;min-width:0}.note:first-child{background:linear-gradient(#ffe9aa,#eaaa43);color:#282d3b}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:none}.actions button{height:34px;border:0;border-radius:9px;background:#345d93;color:white;font-weight:750;font-size:12px;touch-action:manipulation}.actions button:disabled{opacity:.45}.feedback{font-size:12px;color:#ddedff;min-height:16px;flex:none}.feedback.good{color:#8ef0b7}.feedback.bad{color:#ff9fa4}.piano{height:clamp(84px,27dvh,156px);position:relative;flex:none;border:1px solid #6c86a6;border-radius:6px;overflow:hidden;touch-action:none;background:#dde5f2}.key{position:absolute;top:0;margin:0;border-radius:0 0 4px 4px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;display:flex;align-items:flex-end;justify-content:center;padding:0 0 5px;font-size:10px}.white{height:100%;background:linear-gradient(#fff,#dce4ed);border:1px solid #8c9daf;color:#33465c}.black{height:63%;background:linear-gradient(#333d53,#0b101d);border:1px solid #070c15;z-index:2;color:white}.key.target{background:linear-gradient(#ffedaa,#ffb84d)!important;color:#18233b;z-index:4;box-shadow:inset 0 0 0 2px #fff0bb}.key.active{background:#83ddb0!important}.portrait-tip{display:none}
@media(orientation:portrait){.app{gap:6px}.top{align-items:flex-start}.title{font-size:18px}.settings{flex-wrap:wrap}.settings label{font-size:10px}.guide{max-height:35dvh}.piano{height:26dvh}.portrait-tip{display:block;color:#f5d587;font-size:12px;text-align:center}.key{font-size:8px}.feedback{font-size:11px}}
@media(orientation:landscape) and (max-height:390px){.app{gap:3px}.guide{padding:3px 8px}.settings select{height:26px}.actions button{height:28px}.piano{height:29dvh}.top .subtitle{display:none}.feedback{font-size:10px;min-height:12px}}
</style></head><body><main class="app"><div class="top"><div><div class="subtitle">MOONLIGHT TRAINER · v4.2</div><div class="title">月光 第3楽章 🎹</div></div><div class="status" id="count">1 / 8音</div></div><div class="settings"><label>練習 <select id="length"><option value="4">4音</option><option value="8" selected>8音</option><option value="15">15音</option></select></label><label>速度 <select id="speed"><option value="1100">とてもゆっくり</option><option value="750" selected>ゆっくり</option><option value="430">少し速く</option></select></label></div><div class="guide"><div class="current"><div class="next" id="next">—</div><div class="finger" id="finger"></div></div><div class="progress"><div class="fill" id="fill"></div></div><div class="roll" id="roll"></div></div><div class="actions"><button id="demo">▶ お手本</button><button id="hear">♪ 次の音</button><button id="restart">↺ 最初から</button></div><div class="feedback" id="msg" role="status">鍵盤は動かないよ。黄色い鍵盤を順番に押そう</div><div class="piano" id="piano" aria-label="固定された練習用鍵盤"></div><div class="portrait-tip">📱 iPhoneを横向きにすると、鍵盤を広く使えるよ</div></main><script>
(()=>{'use strict';
// The original third-movement opening right-hand pitch sequence, omitting initial rest.
const notes=[56,61,64,68,61,64,68,73,64,68,73,76,68,73,76];
const fingers=[1,2,3,5,1,2,3,5,1,2,3,5,1,2,5];
const names=['ド','ド♯','レ','レ♯','ミ','ファ','ファ♯','ソ','ソ♯','ラ','ラ♯','シ'];
const $=id=>document.getElementById(id),piano=$('piano');
const isBlack=n=>[1,3,6,8,10].includes(n%12),label=n=>names[n%12]+(Math.floor(n/12)-1);
const whites=[];for(let n=53;n<=79;n++)if(!isBlack(n))whites.push(n);
const keyMap=new Map();
piano.addEventListener('touchmove', e=>e.preventDefault(), {passive:false});
for(const [i,n] of whites.entries())makeKey(n,false,i/whites.length*100,100/whites.length);
for(let n=53;n<=79;n++){if(!isBlack(n))continue;const i=whites.filter(w=>w<n).length;const w=100/whites.length;makeKey(n,true,i*w-w*.33,w*.66)}
function makeKey(n,black,left,width){const el=document.createElement('button');el.type='button';el.className='key '+(black?'black':'white');el.style.left=left+'%';el.style.width=width+'%';if(n%12===0)el.textContent=label(n);el.setAttribute('aria-label',label(n));el.addEventListener('pointerdown',e=>{e.preventDefault();press(n)});piano.append(el);keyMap.set(n,el)}
let pos=0,ctx=null,run=0;const limit=()=>Number($('length').value);
function sound(n){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=ctx||new AC();if(ctx.state==='suspended')ctx.resume();const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=440*Math.pow(2,(n-69)/12);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.15,t+.018);g.gain.exponentialRampToValueAtTime(.001,t+.45);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.5)}catch(e){}}
function message(s,type=''){$('msg').textContent=s;$('msg').className='feedback '+type}
function render(){const end=pos>=limit();$('next').textContent=end?'クリア！ 🎉':'次：'+label(notes[pos]);$('finger').textContent=end?'':'指の目安：'+fingers[pos];$('count').textContent=(end?limit():pos+1)+' / '+limit()+'音';$('fill').style.width=(pos/limit()*100)+'%';for(const el of keyMap.values())el.classList.remove('target');if(!end)keyMap.get(notes[pos]).classList.add('target');$('roll').replaceChildren();for(let i=pos;i<Math.min(limit(),pos+5);i++){const d=document.createElement('div');d.className='note';d.textContent=label(notes[i]);$('roll').appendChild(d)}if(end)message('よくできたね！ 次の長さにも挑戦しよう','good')}
function press(n){sound(n);const el=keyMap.get(n);el.classList.add('active');setTimeout(()=>el.classList.remove('active'),140);if(pos>=limit())return;if(notes[pos]===n){pos++;message('正解！','good');render()}else message('もう一度。黄色い鍵盤を押してね','bad')}
function restart(){run++;$('demo').disabled=false;pos=0;message('鍵盤は固定。黄色い鍵盤を順番に押そう');render()}
$('restart').addEventListener('click',restart);$('length').addEventListener('change',restart);$('hear').addEventListener('click',()=>sound(notes[Math.min(pos,limit()-1)]));$('demo').addEventListener('click',async()=>{const token=++run;$('demo').disabled=true;const ms=Number($('speed').value);for(let i=0;i<limit()&&token===run;i++){const el=keyMap.get(notes[i]);el.classList.add('active');sound(notes[i]);await new Promise(r=>setTimeout(r,ms));el.classList.remove('active')}if(token===run){$('demo').disabled=false;render()}});
render();
})();</script></body></html>
