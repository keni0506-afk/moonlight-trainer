<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#091426">
  <title>MOONLIGHT TRAINER | 月光 第3楽章</title>
  <link rel="stylesheet" href="trainer.css">
  <script defer src="score.js"></script>
  <script defer src="trainer.js"></script>
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>月光 第3楽章</h1>
      <span class="version">v0.5.0</span>
    </header>
    <div class="controls">
      <label>練習 <select id="length">
        <option value="4">4音</option><option value="8" selected>8音</option><option value="15">15音</option>
      </select></label>
      <label>速度 <select id="speed">
        <option value="1100">超低速</option>
        <option value="750" selected>ゆっくり</option>
        <option value="430">少し速く</option>
        <option value="250">♩=60</option>
        <option value="156.25">♩=96</option>
        <option value="125">♩=120</option>
        <option value="fast">♩=168</option>
      </select></label>
      <label>開始小節 <select id="from"></select></label>
      <label>終了小節 <select id="to"></select></label>
      <label>手 <select id="hand">
        <option value="both">両手</option><option value="right">右手</option><option value="left">左手</option>
      </select></label>
      <label class="repeat"><input type="checkbox" id="repeat"> リピート</label>
    </div>
    <div class="actions">
      <button id="demo">練習のお手本</button>
      <button id="section">区間のお手本</button>
      <button id="fast">高速 ♩=168</button>
      <button id="pause" disabled>一時停止</button>
      <button id="stop" disabled>停止</button>
      <button id="hear">次の音</button>
      <button id="restart">最初から</button>
    </div>
    <div class="practice">
      <strong id="next">—</strong>
      <span id="finger"></span>
      <span id="count">1 / 8音</span>
      <progress id="progress" value="0" max="8" aria-label="練習の進み具合"></progress>
      <div class="roll" id="roll" aria-label="残りの練習音"></div>
      <span class="legend"><span class="right">右手</span><span class="left">左手</span></span>
      <span id="measure"></span>
    </div>
    <div class="playfield">
      <canvas id="fall" aria-hidden="true"></canvas>
    </div>
    <div class="piano" id="piano" aria-label="固定鍵盤 A1からD6"></div>
    <footer>
      <span id="msg" role="status">黄色い鍵盤を順番に押してください</span>
      <span class="range">鍵盤 A1–D6<span class="portrait-tip"> · 横向き推奨</span></span>
    </footer>
  </main>
</body>
</html>
